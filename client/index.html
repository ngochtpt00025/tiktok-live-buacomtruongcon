<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bữa Cơm Tình Nghĩa — Live</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a0f0a; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    #sizeTag {
      position: fixed; right: 8px; bottom: 8px; z-index: 10; padding: 4px 8px; border-radius: 6px;
      background: rgba(0, 0, 0, .7); color: #fff; font: 12px system-ui, sans-serif;
    }
    #unlock {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; display: none;
      padding: 18px 28px; border-radius: 14px; border: 3px solid #ffd76a; background: #8e1b12; color: #fff;
      font: 700 20px system-ui, sans-serif; cursor: pointer; box-shadow: 0 10px 40px #000a;
    }
    #unlock.on { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="sizeTag" hidden></div>
  <button id="unlock">🔊 Bấm để bật tiếng chủ tiệc</button>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
